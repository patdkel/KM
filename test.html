<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Test</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
 body{margin:0;padding:12px 16px 30px;font:16px/1.4 system-ui,sans-serif;background:#F3F1EA;color:#23281F}
 h1{font-size:20px;margin:4px 0 8px} .t{background:#fff;border-radius:12px;padding:10px;margin:10px 0}
 .t h2{font-size:16px;margin:0 0 6px} model-viewer{width:100%;height:160px;background:#E6E2D8;border-radius:8px}
 .ar{position:absolute;right:8px;bottom:8px;background:#B98048;color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700}
 a.sv{display:inline-block;margin-top:6px;color:#4E6A3D;font-weight:600}
 p{font-size:14px;color:#555;margin:4px 0}
</style></head><body>
<h1>AR test: which ones open?</h1>
<p>For each test, tap the orange button. Then go back and try the green link under it. Note which ones open the camera with the model.</p>
<div id="list"></div>
<script>
const base = location.href.replace(/[^/]*$/, '');
const T = [
 ['1. Google astronaut (known good)', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', 'auto'],
 ['2. Plain cube (my exporter)', base + 'test_cube.glb', 'auto'],
 ['3. Kitchen R4, tabletop size', base + 'R4_kitchen_AR_tabletop.glb', 'auto'],
 ['4. Kitchen R4, full size', base + 'R4_kitchen_AR_fullsize.glb', 'fixed'],
];
const L = document.getElementById('list');
T.forEach(([name, url, scale]) => {
  const d = document.createElement('div'); d.className = 't';
  const sv = 'intent://arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(url) + '&mode=ar_preferred'
    + (scale === 'fixed' ? '&resizable=false' : '')
    + '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end;';
  d.innerHTML = '<h2>' + name + '</h2><model-viewer src="' + url + '" ar ar-modes="webxr scene-viewer" ar-scale="' + scale + '" camera-controls touch-action="pan-y"><button slot="ar-button" class="ar">AR</button></model-viewer><a class="sv" href="' + sv + '">Open directly in Scene Viewer</a>';
  L.appendChild(d);
});
</script>
</body></html>
